      <button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-orange-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">

        </svg>
      </button>
    </div>
  </div>

        <img src="https://i.pravatar.cc/40?img=3" alt="Profile" class="w-10 h-10 rounded-full border-2 border-orange-500">

 <!-- Main Content -->
<main class="flex-1 min-h-screen bg-cover bg-center bg-no-repeat flex justify-center items-start p-6 sm:p-8" style="background-image: url('https://media.istockphoto.com/id/1330424071/photo/large-group-of-people-at-a-concert-party.jpg?s=612x612&w=0&k=20&c=LwdiOCBqbfICjQ3j5AzwyugxmfkbyfL3StKEQhtx4hE=');">

  <div class="bg-white bg-opacity-95 p-6 sm:p-8 rounded-xl shadow-xl w-full max-w-3xl space-y-6">

    <!-- Page Title -->
    <h1 class="text-2xl font-bold">Edit Profile</h1>

    <!-- Avatar -->
    <div class="flex items-center space-x-6">
      <img id="mainProfilePic" src="https://i.pravatar.cc/100?img=3" class="w-24 h-24 rounded-full border" alt="Profile Picture">
      <div>
        <label class="block text-sm font-medium mb-1">Profile Photo</label>
        <input type="file" id="photoInput" class="text-sm" accept="image/*" />
      </div>
    </div>

    <!-- Form Fields -->
    <form class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm mb-1 font-medium">Full Name</label>
          <input type="text" class="w-full border p-2 rounded" placeholder="Andrew Smith" />
        </div>
        <div>
          <label class="block text-sm mb-1 font-medium">Email</label>
          <input type="email" class="w-full border p-2 rounded" placeholder="andrew@example.com" />
        </div>
        <div>
          <label class="block text-sm mb-1 font-medium">Phone</label>
          <input type="tel" class="w-full border p-2 rounded" placeholder="+1 234 567 8901" />
        </div>
        <div>
          <label class="block text-sm mb-1 font-medium">Gig Type</label>
          <select class="w-full border p-2 rounded">
            <option>SOLO</option>
            <option>BAND</option>
            <option>DUO</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm mb-1 font-medium">Bio</label>
        <textarea class="w-full border p-2 rounded" rows="4" placeholder="Tell us about your style, experience, and vibe..."></textarea>
      </div>

      <div class="text-right">
        <button type="submit" class="bg-orange-600 text-white px-6 py-2 rounded hover:bg-orange-700">Save Changes</button>
      </div>
    </form>
  </div>
</main>
